# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  COMPOSE_FILE: docker/compose.yml
  ENV_FILE: .env

### Run "task" in the terminal to build and start

tasks:
  default:
    desc: Create .env on first run, then build and start in watch mode
    deps:
      - env
    cmds:
      # docker compose watch rebuilds/restarts whenever the Dockerfile,
      # compose.yml, entrypoint.sh or .env change.
      - "docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} watch"
    # silent: true

  env:
    desc: Create the .env file from env.example (skipped if it already exists)
    cmds:
      - cp env.example .env -n
      - echo "Update your .env file with new secrets"
      # Fail on purpose so "task" stops and waits for you to fill in .env.
      - exit 1
    status:
      - test -f "{{.ENV_FILE}}"

  build:
    desc: Build the image
    cmds:
      - "docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} build"

  run_detach:
    desc: Start the stack in the background (detached)
    cmds:
      - "docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} up -d"

  logs:
    desc: Follow the container logs
    cmds:
      - "docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} logs -f"

  down:
    desc: Stop and remove the containers
    cmds:
      - "docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} down"

  pre-commit:
    desc: Install pre-commit hooks and run them against all files
    # https://pre-commit.com/
    cmds:
      - pre-commit install
      - pre-commit run --all-files
