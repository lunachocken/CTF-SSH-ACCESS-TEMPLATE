# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  DOCKER_PATH: docker
  COMPOSE:
    sh: "basename $(find . -name '*compose*')"


### RUN: "task" in terminal to build and run

tasks:
  default:
    deps:
      # - task: env
      - task: build
    desc: Build Docker
    cmds: # Sets it up such that any changes to Dockerfile/Compose.yml automatically restarts
      - "docker compose -f {{.DOCKER_PATH}}/{{.COMPOSE}} watch"
    # silent: true
  build:
    cmds:
      - "docker compose -f {{.DOCKER_PATH}}/{{.COMPOSE}} build"

  run_detatch: # Starts the service and detaches
    cmds:
      - "docker compose -f {{.DOCKER_PATH}}/{{.COMPOSE}} up -d"
  down:
    cmds:
      - "docker compose -f {{.DOCKER_PATH}}/{{.COMPOSE}} down"

  pre-commit: # https://pre-commit.com/
    cmds:
      - pre-commit install # Installs hooks so precommit runs
